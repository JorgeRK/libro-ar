  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    #inicio {
      position: fixed; inset: 0; width: 100vw; height: 100vh;
      z-index: 10000;
      /* Eliminamos el flex-end para usar posicionamiento absoluto controlado */
      display: flex; flex-direction: column; align-items: center;
      background: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.7)), url('./fondo.jpg');
      background-size: cover; background-position: center;
    }

    /* Ajuste para los elementos centrados pero un poco más arriba */
    #contenedor-textos {
      margin-top: 55%; /* Esto asegura que el bloque empiece desde el centro hacia arriba */
      display: flex; flex-direction: column; align-items: center; gap: 15px;
      width: 100%;
    }
    
    #inicio h1 { color: #fff; font-size: 28px; margin: 0; font-weight: 700; text-align: center; }
    
    #btn-comenzar {
      border: 0; padding: 16px 40px; background: #2563eb; color: white;
      font-size: 18px; font-weight: 700; border-radius: 12px; cursor: pointer;
    }
    #btn-comenzar:active { transform: scale(0.97); }
    
    #video-container {
      position: fixed; inset: 0; width: 100vw; height: 100vh;
      z-index: 5000; display: none; background: #000;
    }
    #video-pantalla { width: 100%; height: 100%; object-fit: cover; }
    #btn-cerrar {
      position: absolute; top: 20px; right: 20px; z-index: 5001;
      background: rgba(0, 0, 0, 0.7); color: #fff; border: 1px solid #fff;
      border-radius: 50%; width: 44px; height: 44px; font-size: 22px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
  </style>
