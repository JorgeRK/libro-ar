<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>100 Citas Juntos</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #111827;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 20px;
      }
      #overlay h1 {
        color: #ffffff;
        font-size: 26px;
        margin: 0;
        font-weight: bold;
      }
      #start-btn {
        padding: 14px 32px;
        font-size: 16px;
        font-weight: bold;
        background-color: #2563eb;
        color: #ffffff;
        border: none;
        border-radius: 10px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="overlay">
      <h1>100 Citas Juntos</h1>
      <button id="start-btn">Comenzar</button>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: yes;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights: true" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <video 
          id="vid0" 
          src="./Videos/Cita001.mp4" 
          preload="auto" 
          loop 
          playsinline 
          webkit-playsinline 
          crossorigin="anonymous">
        </video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="target0" mindar-image-target="targetIndex: 0">
        <!-- Dimensiones ajustadas para cubrir la foto completa (ancho 0.68 x alto 1) -->
        <a-video 
          id="ar-video0" 
          src="#vid0" 
          position="0 0 0" 
          height="1" 
          width="0.68" 
          rotation="0 0 0">
        </a-video>
      </a-entity>
    </a-scene>

    <script>
      const overlay = document.getElementById('overlay');
      const startBtn = document.getElementById('start-btn');
      const video = document.getElementById('vid0');
      const target0 = document.getElementById('target0');
      const sceneEl = document.querySelector('a-scene');

      startBtn.addEventListener('click', () => {
        overlay.style.display = 'none';

        // Despierta el motor de video y desbloquea el audio
        video.muted = false;
        video.play().then(() => {
          video.pause();
        }).catch(err => console.log(err));

        // Arranca la cámara
        sceneEl.systems['mindar-image-system'].start();
      });

      target0.addEventListener('targetFound', () => {
        video.play();
      });

      target0.addEventListener('targetLost', () => {
        video.pause();
      });
    </script>
  </body>
</html>
