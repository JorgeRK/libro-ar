<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no,
             viewport-fit=cover"
  >

  <title>100 Citas Juntos</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    /* =====================================================
       PANTALLA INICIAL
       ===================================================== */

    #inicio {
      position: fixed;
      inset: 0;

      width: 100vw;
      height: 100vh;

      background: #111827;

      z-index: 10000;

      display: flex;
      flex-direction: column;

      justify-content: center;
      align-items: center;

      gap: 30px;
    }

    #inicio h1 {
      margin: 0;

      color: white;

      font-size: clamp(30px, 8vw, 60px);

      font-weight: 700;

      text-align: center;
    }

    #btn-comenzar {
      border: 0;

      padding: 18px 42px;

      background: #2563eb;

      color: white;

      font-size: 20px;

      font-weight: 700;

      border-radius: 14px;

      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.35);

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
    }

    #btn-comenzar:active {
      transform: scale(0.97);
    }


    /* =====================================================
       CÁMARA
       ===================================================== */

    a-scene {
      position: fixed !important;

      inset: 0 !important;

      width: 100vw !important;
      height: 100vh !important;

      z-index: 1 !important;
    }


    /* =====================================================
       VIDEO A PANTALLA COMPLETA
       ===================================================== */

    #video-pantalla {
      position: fixed;

      inset: 0;

      width: 100vw;
      height: 100vh;

      z-index: 5000;

      display: none;

      background: #000;

      object-fit: cover;

      object-position: center center;

      border: 0;

      margin: 0;
      padding: 0;
    }


    /* =====================================================
       INDICADOR
       ===================================================== */

    #indicador {
      position: fixed;

      left: 50%;

      bottom: 25px;

      transform: translateX(-50%);

      z-index: 6000;

      display: none;

      color: white;

      background: rgba(0,0,0,0.65);

      padding: 9px 18px;

      border-radius: 25px;

      font-size: 14px;

      font-weight: 600;

      backdrop-filter: blur(5px);
    }

  </style>
</head>


<body>


  <!-- =====================================================
       PANTALLA DE INICIO
       ===================================================== -->

  <div id="inicio">

    <h1>100 Citas Juntos</h1>

    <button id="btn-comenzar">
      Comenzar Experiencia
    </button>

  </div>


  <!-- =====================================================
       VIDEO ÚNICO
       
       IMPORTANTE:
       NO está dentro del target AR.
       Por eso NO tiembla.
       ===================================================== -->

  <video
    id="video-pantalla"

    playsinline
    webkit-playsinline

    preload="auto"

    controls="false"

    crossorigin="anonymous"
  ></video>


  <div id="indicador"></div>


  <!-- =====================================================
       MINDAR
       ===================================================== -->

  <a-scene

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
      uiScanning: yes;
      uiLoading: no;
      uiError: no;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

  >

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

    <!--

      LOS TARGETS ESTÁN VACÍOS.

      Esto es intencional.

      El video NO se coloca encima de ellos.
      Solo usamos MindAR para saber cuál imagen
      está mirando la cámara.

    -->

    <a-entity
      id="target0"
      mindar-image-target="targetIndex: 0"
    ></a-entity>
