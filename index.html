<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Proyecto 1 - AR</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #inicio { position: fixed; inset: 0; z-index: 10000; background: #000; display: flex; align-items: center; justify-content: center; }
    #btn-comenzar { padding: 16px 40px; background: #2563eb; color: white; font-size: 18px; border-radius: 12px; cursor: pointer; }
    
    #video-container { position: fixed; inset: 0; z-index: 20000; display: none; background: #000; }
    #video-pantalla { width: 100%; height: 100%; object-fit: cover; }
    
    /* Botón X blindado con prioridad máxima */
    #btn-cerrar { position: fixed; top: 30px; right: 30px; z-index: 30000; background: rgba(255, 255, 255, 0.2); color: white; border: 2px solid white; border-radius: 50%; width: 60px; height: 60px; font-size: 30px; cursor: pointer; display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
  </style>
</head>
<body>

  <div id="inicio"><button id="btn-comenzar">Comenzar</button></div>

  <div id="video-container">
    <button id="btn-cerrar">&#10005;</button>
    <video id="video-pantalla" playsinline webkit-playsinline loop preload="auto" crossorigin="anonymous"></video>
  </div>

  <a-scene id="escena" mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: yes;" vr-mode-ui="enabled: false">
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="targets-group"></a-entity>
  </a-scene>

  <script>
    const container = document.getElementById('video-container');
    const video = document.getElementById('video-pantalla');
    const btnCerrar = document.getElementById('btn-cerrar');
    const escena = document.getElementById('escena');

    // LISTA DE VIDEOS (Dropbox)
    const videos = [
      "URL_DROPBOX_1&dl=1", 
      "URL_DROPBOX_2&dl=1"
    ];

    for (let i = 0; i < videos.length; i++) {
      const el = document.createElement('a-entity');
      el.setAttribute('mindar-image-target', `targetIndex: ${i}`);
      el.addEventListener('targetFound', () => {
        // Pausamos la escena para que el botón de cerrar tome el control
        escena.pause();
        video.src = videos[i];
        container.style.display = 'block';
        video.play();
      });
      document.getElementById('targets-group').appendChild(el);
    }

    function cerrarVideo(e) {
      if(e) { e.preventDefault(); e.stopPropagation(); }
      video.pause();
      video.currentTime = 0;
      container.style.display = 'none';
      // Reactivamos la escena para seguir buscando imágenes
      escena.play();
    }

    btnCerrar.addEventListener('click', cerrarVideo);
    btnCerrar.addEventListener('touchend', cerrarVideo);

    document.getElementById('btn-comenzar').addEventListener('click', () => {
      document.getElementById('inicio').style.display = 'none';
      escena.systems['mindar-image-system'].start();
    });
  </script>
</body>
</html>
