<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>100 Citas Juntos</title>


  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>


  <!-- MINDAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #303030;

      font-family: Arial, sans-serif;

    }


    /* =====================================
       PANTALLA DE INICIO
       ===================================== */

    #inicio {

      position: fixed;

      top: 0;
      left: 0;

      width: 100vw;
      height: 100vh;

      z-index: 5000;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      background: #303030;

      color: white;

      text-align: center;

    }


    #inicio h1 {

      margin: 0 20px 60px;

      font-size: 40px;

      font-weight: 600;

    }


    #btn-comenzar {

      padding: 20px 55px;

      border: none;

      border-radius: 14px;

      background: #2864e8;

      color: white;

      font-size: 25px;

      font-weight: bold;

      cursor: pointer;

    }


    #btn-comenzar:active {

      transform: scale(0.97);

    }


    /* =====================================
       VIDEO A PANTALLA COMPLETA
       ===================================== */

    #video-fullscreen {

      position: fixed;

      top: 0;
      left: 0;

      width: 100vw;
      height: 100vh;

      object-fit: cover;

      background: black;

      z-index: 3000;

      display: none;

      pointer-events: none;

    }


    /* =====================================
       BOTÓN DE SONIDO
       ===================================== */

    #btn-sonido {

      position: fixed;

      top: 20px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 4000;

      display: none;

      padding: 14px 24px;

      border: 2px solid white;

      border-radius: 10px;

      background: rgba(0, 0, 0, 0.85);

      color: white;

      font-size: 16px;

      font-weight: bold;

    }


    /* =====================================
       A-FRAME
       ===================================== */

    a-scene {

      position: fixed;

      top: 0;
      left: 0;

      width: 100vw;
      height: 100vh;

      z-index: 1;

    }

  </style>

</head>


<body>


  <!-- =====================================
       PANTALLA INICIAL
       ===================================== -->

  <div id="inicio">

    <h1>
      100 Citas Juntos
    </h1>


    <button id="btn-comenzar">

      Comenzar Experiencia

    </button>

  </div>



  <!-- =====================================
       VIDEO
       ===================================== -->

  <video
    id="video-fullscreen"
    playsinline
    webkit-playsinline
    muted
    loop
  ></video>



  <!-- =====================================
       BOTÓN SONIDO
       ===================================== -->

  <button id="btn-sonido">

    🔊 Activar sonido

  </button>



  <!-- =====================================
       MINDAR
       ===================================== -->

  <a-scene

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
      uiScanning: yes;
      uiLoading: yes;
      uiError: yes;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights;
      antialias: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"
  >


    <!-- CÁMARA -->

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>



    <!-- ==================================
         TARGETS

         0  = Cita001
         1  = Cita002
         2  = Cita003
         ...
         99 = Cita100
         ================================== -->


    <a-entity
      mindar-image-target="targetIndex: 0"
      data-cita="001">
    </a-entity>


    <a-entity
      mindar-image-target="targetIndex: 1"
      data-cita="002">
    </a-entity>


    <a-entity
      mindar-image-target="targetIndex: 2"
      data-cita="003">
    </a-entity>


    <a-entity
      mindar-image-target="targetIndex: 3"
