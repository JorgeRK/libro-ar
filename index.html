<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>100 Citas Juntos</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #303030;
      font-family: Arial, sans-serif;
    }

    /* =========================
       PANTALLA INICIAL
       ========================= */

    #inicio {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      background: #303030;
      color: white;

      text-align: center;
    }

    #inicio h1 {
      margin: 0 20px 60px;

      font-size: 40px;
      font-weight: 600;
    }

    #btn-comenzar {
      padding: 20px 45px;

      border: none;
      border-radius: 14px;

      background: #2864e8;
      color: white;

      font-size: 24px;
      font-weight: bold;
    }

    /* =========================
       VIDEO
       ========================= */

    #video {
      position: fixed;

      inset: 0;

      width: 100vw;
      height: 100vh;

      object-fit: cover;

      background: black;

      z-index: 5000;

      display: none;

      pointer-events: none;
    }

    /* =========================
       BOTÓN SONIDO
       ========================= */

    #btn-sonido {
      position: fixed;

      top: 20px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 6000;

      display: none;

      padding: 12px 20px;

      background: rgba(0,0,0,.85);

      color: white;

      border: 2px solid white;

      border-radius: 8px;

      font-size: 15px;

      font-weight: bold;
    }

  </style>

</head>


<body>


  <!-- =========================
       INICIO
       ========================= -->

  <div id="inicio">

    <h1>100 Citas Juntos</h1>

    <button id="btn-comenzar">
      Comenzar Experiencia
    </button>

  </div>


  <!-- =========================
       VIDEO
       ========================= -->

  <video
    id="video"
    playsinline
    webkit-playsinline
    muted
    loop>
  </video>


  <!-- =========================
       SONIDO
       ========================= -->

  <button id="btn-sonido">
    🔊 Activar sonido
  </button>


  <!-- =========================
       MINDAR
       ========================= -->

  <a-scene

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiScanning: yes;
      uiLoading: yes;
      uiError: yes;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false">


    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>


    <!--
      TARGET 0
      = Cita001
    -->

    <a-entity
      mindar-image-target="targetIndex: 0"
      data-cita="001">
    </a-entity>


  </a-scene>


  <script>

    const inicio =
      document.getElementById("inicio");

    const botonComenzar =
      document.getElementById("btn-comenzar");

    const video =
      document.getElementById("video");

    const botonSonido =
      document.getElementById("btn-sonido");


    let citaActual = null;


    /* =========================
       BOTÓN COMENZAR
       ========================= */

    botonComenzar.addEventListener(
      "click",
      function () {

        /*
         * MindAR YA está iniciado
         * automáticamente.
         *
         * Solo quitamos la pantalla
         * de bienvenida.
         */

        inicio.style.display = "none";

      }
    );


    /* =========================
       TARGET
       ========================= */

    const target =
      document.querySelector(
        "[mindar-image-target]"
      );


    /* =========================
       CUANDO ENCUENTRA CITA001
       ========================= */

    target.addEventListener(
      "targetFound",
      function () {

        console.log(
          "Cita001 encontrada"
        );

        reproducirVideo("001");

      }
    );


    /* =========================
       CUANDO DEJA DE VER CITA001
       ========================= */

    target.addEventListener(
      "targetLost",
      function () {

        console.log(
          "Cita001 perdida"
        );

        detenerVideo();

      }
    );


    /* =========================
       REPRODUCIR VIDEO
       ========================= */

    async function reproducirVideo(cita) {

      /*
       * Si ya está reproduciendo
       * la misma cita, no hacemos nada.
       */

      if (citaActual === cita) {
        return;
      }


      citaActual = cita;


      video.pause();


      /*
       * RUTA EXACTA:
       *
       * Videos/Cita001.mp4
       */

      video.src =
        "./Videos/Cita" +
        cita +
        ".mp4";


      video.load();


      /*
       * Pantalla completa.
       */

      video.style.display = "block";


      /*
       * Comienza sin sonido.
       */

      video.muted = true;


      try {

        await video.play();

        botonSonido.style.display =
          "block";

      } catch (error) {

        console.error(
          "Error reproduciendo video:",
          error
        );

      }

    }


    /* =========================
       DETENER VIDEO
       ========================= */

    function detenerVideo() {

      video.pause();

      video.removeAttribute("src");

      video.load();

      video.style.display = "none";

      botonSonido.style.display = "none";

      citaActual = null;

    }


    /* =========================
       ACTIVAR SONIDO
       ========================= */

    botonSonido.addEventListener(
      "click",
      async function () {

        video.muted = false;

        try {

          await video.play();

          botonSonido.style.display =
            "none";

        } catch (error) {

          console.error(error);

        }

      }
    );

  </script>

</body>

</html>
