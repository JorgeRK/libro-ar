<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
  >

  <title>100 Citas Juntos</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>


  <style>

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #000;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;

    }


    /* =========================
       PANTALLA INICIAL
       ========================= */

    #inicio {

      position: fixed;

      inset: 0;

      width: 100vw;
      height: 100vh;

      background: #111827;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      z-index: 999999;

    }


    #titulo {

      color: white;

      font-size: 30px;

      font-weight: bold;

      margin-bottom: 30px;

      text-align: center;

    }


    #comenzar {

      padding: 18px 40px;

      font-size: 20px;

      font-weight: bold;

      color: white;

      background: #2563eb;

      border: none;

      border-radius: 12px;

      box-shadow:
        0 5px 20px rgba(0,0,0,0.3);

    }


    /* =========================
       BOTÓN SONIDO
       ========================= */

    #sonido {

      position: fixed;

      top: 20px;
      right: 20px;

      z-index: 999998;

      padding: 12px 18px;

      color: white;

      background: #2563eb;

      border: none;

      border-radius: 25px;

      font-size: 15px;

      font-weight: bold;

      display: none;

    }

  </style>

</head>


<body>


  <!-- =========================
       INICIO
       ========================= -->

  <div id="inicio">

    <div id="titulo">
      100 Citas Juntos
    </div>

    <button id="comenzar">
      Comenzar Experiencia
    </button>

  </div>


  <!-- =========================
       SONIDO
       ========================= -->

  <button id="sonido">
    🔊 Activar sonido
  </button>



  <!-- =========================
       MINDAR
       ========================= -->

  <a-scene

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;

      uiScanning: yes;

      filterMinCF: 0.00005;
      filterBeta: 0.0001;

      missTolerance: 10;
      warmupTolerance: 5;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

    embedded

  >


    <!-- =========================
         VIDEO
         ========================= -->

    <a-assets>

      <video

        id="vid0"

        src="./Videos/Cita001.mp4"

        preload="auto"

        loop

        muted

        playsinline

        webkit-playsinline

        crossorigin="anonymous"

      ></video>

    </a-assets>



    <!-- =========================
         CÁMARA
         ========================= -->

    <a-camera

      position="0 0 0"

      look-controls="enabled: false"

    ></a-camera>



    <!-- =========================
         CITA 001
         TARGET 0
         ========================= -->

    <a-entity

      id="target0"

      mindar-image-target="
        targetIndex: 0
      "

    >

      <a-video

        id="videoAR"

        src="#vid0"

        position="0 0 0"

        width="0.68"

        height="1"

        rotation="0 0 0"

      ></a-video>

    </a-entity>


  </a-scene>



  <script>


    /* =========================
       ELEMENTOS
       ========================= */

    const inicio =
      document.getElementById("inicio");

    const comenzar =
      document.getElementById("comenzar");

    const sonido =
      document.getElementById("sonido");

    const video =
      document.getElementById("vid0");

    const target =
      document.getElementById("target0");

    const scene =
      document.querySelector("a-scene");


    let sonidoActivado = false;

    let targetDetectado = false;



    /* =========================
       COMENZAR
       ========================= */

    comenzar.addEventListener(
      "click",
      async () => {

        inicio.style.display = "none";


        /*
        IMPORTANTE:

        El video empieza SIEMPRE
        sin sonido.
        */

        video.muted = true;

        video.setAttribute(
          "muted",
          ""
        );

        video.setAttribute(
          "playsinline",
          ""
        );


        /*
        Iniciar cámara
        */

        try {

          const mindar =
            scene.systems[
              "mindar-image-system"
            ];

          await mindar.start();

          console.log(
            "MindAR iniciado"
          );

        }

        catch (error) {

          console.error(
            "Error iniciando MindAR:",
            error
          );

        }

      }
    );



    /* =========================
       IMAGEN ENCONTRADA
       ========================= */

    target.addEventListener(
      "targetFound",
      async () => {

        console.log(
          "Cita001 encontrada"
        );

        targetDetectado = true;


        /*
        SIEMPRE empieza
        sin sonido.
        */

        if (!sonidoActivado) {

          video.muted = true;

        }


        try {

          await video.play();

          console.log(
            "Video reproduciéndose"
          );


          /*
          Mostrar botón
          */

          if (!sonidoActivado) {

            sonido.style.display =
              "block";

          }

        }

        catch (error) {

          console.error(
            "Error reproduciendo video:",
            error
          );

        }

      }
    );



    /* =========================
       IMAGEN PERDIDA
       ========================= */

    target.addEventListener(
      "targetLost",
      () => {

        console.log(
          "Cita001 perdida"
        );

        targetDetectado = false;

        video.pause();

        sonido.style.display =
          "none";

      }
    );



    /* =========================
       ACTIVAR SONIDO
       ========================= */

    sonido.addEventListener(
      "click",
      async () => {

        sonidoActivado = true;

        video.muted = false;


        try {

          await video.play();

        }

        catch (error) {

          console.error(
            "Error activando sonido:",
            error
          );

        }


        sonido.style.display =
          "none";

      }
    );


  </script>


</body>

</html>
