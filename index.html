<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>100 Citas</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    /* Video a pantalla completa */
    #video-fullscreen {
      position: fixed;
      inset: 0;

      width: 100vw;
      height: 100vh;

      object-fit: cover;

      z-index: 1000;

      display: none;

      background: black;
    }

    /* Botón de sonido */
    #btn-sound {
      position: fixed;

      top: 20px;
      left: 50%;
      transform: translateX(-50%);

      z-index: 2000;

      padding: 14px 24px;

      border: 2px solid white;
      border-radius: 10px;

      background: rgba(0, 0, 0, 0.85);
      color: white;

      font-family: Arial, sans-serif;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <!-- VIDEO QUE OCUPARÁ TODA LA PANTALLA -->
  <video
    id="video-fullscreen"
    playsinline
    webkit-playsinline
    muted
    loop>
  </video>


  <!-- BOTÓN PARA ACTIVAR SONIDO -->
  <button id="btn-sound">
    🔊 Activar sonido
  </button>


  <!-- MINDAR -->
  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiScanning: yes;
      uiLoading: yes;
      uiError: yes;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>


    <!--
      TARGET 0 = Cita001
      TARGET 1 = Cita002
      TARGET 2 = Cita003
      ...
      TARGET 99 = Cita100

      Solo utilizamos estos targets para
      detectar las imágenes.
    -->

    <a-entity
      mindar-image-target="targetIndex: 0"
      data-cita="001">
    </a-entity>

    <a-entity
      mindar-image-target="targetIndex: 1"
      data-cita="002">
    </a-entity>

    <a-entity
      mindar-image-target="targetIndex: 2"
