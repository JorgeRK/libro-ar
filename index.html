<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>100 Citas Juntos</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; 
      background: transparent; /* <-- ESTA ES LA CORRECCIÓN */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #inicio {
      position: fixed; inset: 0; width: 100vw; height: 100vh;
      background: #111827; z-index: 10000;
      display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 25px;
    }
    #inicio h1 { color: #fff; font-size: 32px; margin: 0; font-weight: 700; }
    #btn-comenzar {
      border: 0; padding: 16px 36px; background: #2563eb; color: white;
      font-size: 18px; font-weight: 700; border-radius: 12px; cursor: pointer;
    }
    #btn-comenzar:active { transform: scale(0.97); }
    #video-container {
      position: fixed; inset: 0; width: 100vw; height: 100vh;
      z-index: 5000; display: none; background: #000;
    }
    #video-pantalla { width: 100%; height: 100%; object-fit: cover; }
    #btn-cerrar {
      position: absolute; top: 20px; right: 20px; z-index: 5001;
      background: rgba(0, 0, 0, 0.7); color: #fff; border: 1px solid #fff;
      border-radius: 50%; width: 44px; height: 44px; font-size: 22px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
  </style>
</head>
<body>

  <div id="inicio">
    <h1>100 Citas Juntos</h1>
    <button id="btn-comenzar">Comenzar Experiencia</button>
  </div>

  <div id="video-container">
    <button id="btn-cerrar">&times;</button>
    <video id="video-pantalla" playsinline webkit-playsinline loop preload="auto"></video>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: yes;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    
    <a-entity id="targets-group"></a-entity>
  </a-scene>

  <script>
    const inicio = document.getElementById('inicio');
    const btnComenzar = document.getElementById('btn-comenzar');
    const container = document.getElementById('video-container');
    const video = document.getElementById('video-pantalla');
    const btnCerrar = document.getElementById('btn-cerrar');
    const targetsGroup = document.getElementById('targets-group');
    const sceneEl = document.querySelector('a-scene');

    let videoActual = null;

    for (let i = 0; i < 100; i++) {
      const el = document.createElement('a-entity');
      el.setAttribute('mindar-image-target', `targetIndex: ${i}`);
      
      const numCita = String(i + 1).padStart(3, '0');
      const rutaVideo = `./Videos/Cita${numCita}.mp4`;

      el.addEventListener('targetFound', () => {
        if (videoActual !== rutaVideo) {
          video.src = rutaVideo;
          videoActual = rutaVideo;
        }
        
        video.muted = false;
        container.style.display = 'block';
        video.play().catch(e => console.log('Error play:', e));
      });

      el.addEventListener('targetLost', () => {
        if (videoActual === rutaVideo) {
          video.pause();
          container.style.display = 'none';
        }
      });

      targetsGroup.appendChild(el);
    }

    btnComenzar.addEventListener('click', async () => {
      inicio.style.display = 'none';
      video.muted = false;
      const mindarSystem = sceneEl.systems['mindar-image-system'];
      await mindarSystem.start();
    });

    btnCerrar.addEventListener('click', () => {
      video.pause();
      video.currentTime = 0; 
      videoActual = null;    
      container.style.display = 'none';
    });
  </script>
</body>
</html>
