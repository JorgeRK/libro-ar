<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>100 Citas Juntos</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #303030;

      font-family: Arial, sans-serif;
    }


    /* PANTALLA INICIAL */

    #inicio {
      position: fixed;

      inset: 0;

      z-index: 9999;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      background: #303030;

      color: white;

      text-align: center;
    }


    #inicio h1 {
      margin: 0 20px 60px;

      font-size: 40px;

      font-weight: 600;
    }


    #btn-comenzar {
      padding: 20px 45px;

      border: none;

      border-radius: 14px;

      background: #2864e8;

      color: white;

      font-size: 24px;

      font-weight: bold;
    }


    /* MENSAJE DE ERROR */

    #error {
      position: fixed;

      inset: 0;

      z-index: 10000;

      display: none;

      justify-content: center;

      align-items: center;

      padding: 30px;

      background: #303030;

      color: white;

      text-align: center;

      font-size: 18px;
    }


    /* VIDEO */

    #video-fullscreen {
      position: fixed;

      inset: 0;

      width: 100vw;
      height: 100vh;

      object-fit: cover;

      background: black;

      z-index: 5000;

      display: none;

      pointer-events: none;
    }


    /* SONIDO */

    #btn-sonido {
      position: fixed;

      top: 20px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 6000;

      display: none;

      padding: 14px 24px;

      border: 2px solid white;

      border-radius: 10px;

      background: rgba(0,0,0,.85);

      color: white;

      font-size: 16px;

      font-weight: bold;
    }

  </style>

</head>


<body>


  <!-- PANTALLA DE INICIO -->

  <div id="inicio">

    <h1>100 Citas Juntos</h1>

    <button id="btn-comenzar">
      Comenzar Experiencia
    </button>

  </div>


  <!-- MENSAJE DE ERROR -->

  <div id="error">
    <div>
      <h2>No se pudo iniciar la cámara</h2>

      <p id="texto-error"></p>

      <p>
        Verifica que Chrome tenga permiso para usar
        la cámara.
      </p>
    </div>
  </div>


  <!-- VIDEO -->

  <video
    id="video-fullscreen"
    playsinline
    webkit-playsinline
    muted
    loop>
  </video>


  <!-- SONIDO -->

  <button id="btn-sonido">
    🔊 Activar sonido
  </button>


  <!-- MINDAR -->

  <a-scene

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
      uiScanning: yes;
      uiLoading: yes;
      uiError: yes;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false">


    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>


    <!--
      POR AHORA SOLO CITA001

      target 0 = Cita001
    -->

    <a-entity
      mindar-image-target="targetIndex: 0"
      data-cita="001">
    </a-entity>


  </a-scene>


  <script>

    const inicio =
      document.getElementById("inicio");

    const boton =
      document.getElementById("btn-comenzar");

    const errorBox =
      document.getElementById("error");

    const textoError =
      document.getElementById("texto-error");

    const video =
      document.getElementById("video-fullscreen");

    const botonSonido =
      document.getElementById("btn-sonido");

    const escena =
      document.querySelector("a-scene");


    let citaActual = null;

    let experienciaIniciada = false;

    let targetEncontrado = false;



    /* =====================================
       COMENZAR
       ===================================== */

    boton.addEventListener(
      "click",
      async function () {

        if (experienciaIniciada) {
          return;
        }

        experienciaIniciada = true;


        console.log("Botón pulsado");


        /*
         * Esperamos a que A-Frame termine
         * de cargar.
         */

        if (!escena.hasLoaded) {

          await new Promise(function(resolve) {

            escena.addEventListener(
              "loaded",
              resolve,
              { once: true }
            );

          });

        }


        console.log("A-Frame cargado");


        try {

          const sistema =
            escena.systems["mindar-image-system"];


          if (!sistema) {

            throw new Error(
              "MindAR no se pudo cargar."
            );

          }


          console.log(
            "Iniciando cámara..."
          );


          /*
           * AHORA SÍ iniciamos MindAR
           * desde el botón.
           */

          await sistema.start();


          console.log(
            "CÁMARA INICIADA"
          );


          /*
           * Quitamos la pantalla inicial
           * SOLO después de iniciar la cámara.
           */

          inicio.style.display = "none";


        } catch (e) {

          console.error(e);


          textoError.textContent =
            e.message ||
            "Error desconocido";


          errorBox.style.display =
            "flex";

        }

      }
    );



    /* =====================================
       CITA ENCONTRADA
       ===================================== */

    const target =
      document.querySelector(
        '[mindar-image-target]'
      );


    target.addEventListener(
      "targetFound",
      function () {

        console.log(
          "CITA001 ENCONTRADA"
        );


        targetEncontrado = true;


        reproducirVideo("001");

      }
    );



    /* =====================================
       CITA PERDIDA
       ===================================== */

    target.addEventListener(
      "targetLost",
      function () {

        console.log(
          "CITA001 PERDIDA"
        );


        targetEncontrado = false;


        detenerVideo();

      }
    );



    /* =====================================
       REPRODUCIR VIDEO
       ===================================== */

    async function reproducirVideo(cita) {


      if (citaActual === cita) {
        return;
      }


      citaActual = cita;


      video.pause();


      /*
       * IMPORTANTE:
       *
       * V mayúscula:
       *
       * Videos/Cita001.mp4
       */

      video.src =
        "./Videos/Cita" +
        cita +
        ".mp4";


      video.load();


      video.style.display =
        "block";


      video.muted = true;


      try {

        await video.play();


        botonSonido.style.display =
          "block";


      } catch (e) {

        console.error(
          "Error reproduciendo video:",
          e
        );

      }

    }



    /* =====================================
       DETENER VIDEO
       ===================================== */

    function detenerVideo() {


      video.pause();


      video.removeAttribute(
        "src"
      );


      video.load();


      video.style.display =
        "none";


      botonSonido.style.display =
        "none";


      citaActual = null;

    }



    /* =====================================
       SONIDO
       ===================================== */

    botonSonido.addEventListener(
      "click",
      async function () {

        video.muted = false;


        try {

          await video.play();

          botonSonido.style.display =
            "none";

        } catch (e) {

          console.error(e);

        }

      }
    );

  </script>

</body>

</html>
