<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>100 Citas Juntos</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #000000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #top-bar {
        position: fixed;
        top: 15px;
        left: 0;
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 15px;
        box-sizing: border-box;
        z-index: 99999;
        pointer-events: none;
      }
      #project-title {
        color: #ffffff;
        font-size: 16px;
        font-weight: bold;
        background: rgba(0, 0, 0, 0.65);
        padding: 8px 14px;
        border-radius: 20px;
        backdrop-filter: blur(4px);
      }
      #btn-sound {
        pointer-events: auto;
        padding: 8px 16px;
        font-size: 14px;
        font-weight: bold;
        background: #2563eb;
        color: #ffffff;
        border: none;
        border-radius: 20px;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }
    </style>
  </head>
  <body>
    <div id="top-bar">
      <div id="project-title">100 Citas Juntos</div>
      <button id="btn-sound">Activar Sonido</button>
    </div>

    <!-- autoStart: true para que pida permisos de cámara directamente -->
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: yes;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights: true" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">

      <a-assets>
        <!-- Ruta actualizada a la carpeta Videos/Cita001.mp4 -->
        <video 
          id="vid0" 
          src="./Videos/Cita001.mp4" 
          preload="auto" 
          loop 
          muted
          crossorigin="anonymous"
          playsinline 
          webkit-playsinline>
        </video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="target0" mindar-image-target="targetIndex: 0">
        <a-video 
          id="ar-video0" 
          src="#vid0" 
          position="0 0 0" 
          height="1" 
          width="0.5625" 
          rotation="0 0 0">
        </a-video>
      </a-entity>
    </a-scene>

    <script>
      const soundBtn = document.getElementById('btn-sound');
      const video = document.getElementById('vid0');
      const target0 = document.getElementById('target0');
      let soundActivated = false;

      soundBtn.addEventListener('click', () => {
        soundActivated = true;
        video.muted = false;
        soundBtn.style.display = 'none';
      });

      target0.addEventListener('targetFound', () => {
        if (soundActivated) {
          video.muted = false;
        }
        video.play().catch(e => console.log('Error de reproducción:', e));
      });

      target0.addEventListener('targetLost', () => {
        video.pause();
      });
    </script>
  </body>
</html>
