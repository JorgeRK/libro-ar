<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>100 Citas Juntos</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #303030;
      font-family: Arial, sans-serif;
    }

    /* =========================================
       PANTALLA DE INICIO
       ========================================= */

    #inicio {
      position: fixed;
      inset: 0;

      z-index: 5000;

      display: flex;
      flex-direction: column;

      justify-content: center;
      align-items: center;

      background: #303030;

      color: white;

      text-align: center;
    }

    #inicio h1 {
      margin: 0 20px 35px;

      font-size: 30px;
      font-weight: 500;
    }

    #btn-comenzar {
      padding: 18px 45px;

      border: none;
      border-radius: 12px;

      background: #2864e8;
      color: white;

      font-size: 22px;
      font-weight: bold;

      cursor: pointer;

      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
    }

    #btn-comenzar:active {
      transform: scale(0.97);
    }


    /* =========================================
       VIDEO A PANTALLA COMPLETA
       ========================================= */

    #video-fullscreen {
      position: fixed;

      top: 0;
      left: 0;

      width: 100vw;
      height: 100vh;

      object-fit: cover;

      z-index: 3000;

      display: none;

      background: black;

      /* Permite que MindAR siga recibiendo
         la interacción y funcionando detrás */
      pointer-events: none;
    }


    /* =========================================
       BOTÓN DE SONIDO
       ========================================= */

    #btn-sonido {
      position: fixed;

      top: 20px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 4000;

      display: none;

      padding: 14px 24px;

      border: 2px solid white;
      border-radius: 10px;

      background: rgba(0, 0, 0, 0.85);

      color: white;

      font-size: 16px;
      font-weight: bold;
    }


    /* =========================================
       CÁMARA / A-FRAME
       ========================================= */

    a-scene {
      position: fixed;

      inset: 0;

      z-index: 1;
    }
  </style>
</head>


<body>


  <!-- =========================================
       PANTALLA DE INICIO
       ========================================= -->

  <div id="inicio">

    <h1>100 Citas Juntos</h1>

    <button id="btn-comenzar">
      Comenzar Experiencia
    </button>

  </div>


  <!-- =========================================
       VIDEO
       ========================================= -->

  <video
    id="video-fullscreen"
    playsinline
    webkit-playsinline
    muted
    loop>
  </video>


  <!-- =========================================
       BOTÓN DE SONIDO
       ========================================= -->

  <button id="btn-sonido">
    🔊 Activar sonido
  </button>

      autoStart: false;
      uiScanning: yes;
      uiLoading: yes;
      uiError: yes;

      physicallyCorrectLights;
      antialias: true;

  <script>

    const inicio = document.getElementById("inicio");
    const btnComenzar = document.getElementById("btn-comenzar");

    const video = document.getElementById("video-fullscreen");
    const btnSonido = document.getElementById("btn-sonido");

    const scene = document.querySelector("a-scene");

    let citaActual = null;
    let targetsVisibles = new Set();


    /* =========================================
       COMENZAR EXPERIENCIA
       ========================================= */

    btnComenzar.addEventListener("click", async () => {

      inicio.style.display = "none";

      const mindarSystem =
        scene.systems["mindar-image-system"];

      try {

        await mindarSystem.start();

      } catch (error) {

        console.error(
          "No se pudo iniciar la cámara:",
          error
        );

      }

    });


    /* =========================================
       OBTENER VIDEO
       ========================================= */

    function obtenerVideo(cita) {

      return "./videos/Cita" + cita + ".mp4";

    }


    /* =========================================
       REPRODUCIR CITA
       ========================================= */

    async function reproducirCita(cita) {

      /*
       * Si ya estamos reproduciendo
       * esa misma cita, no hacemos nada.
       */

      if (citaActual === cita) {
        return;
      }


      citaActual = cita;

      console.log(
        "Cita detectada:",
        cita
      );


      video.pause();


      video.src = obtenerVideo(cita);


      video.load();


      video.style.display = "block";


      /*
       * Primero intentamos reproducir
       * sin sonido.
       */

      video.muted = true;


      try {

        await video.play();

        btnSonido.style.display = "block";

      } catch (error) {

        console.error(
          "Error reproduciendo video:",
          error
        );

      }

    }


    /* =========================================
       OCULTAR VIDEO
       ========================================= */

    function ocultarVideo() {

      /*
       * Si todavía estamos viendo otra
       * imagen, no ocultamos el video.
       */

      if (targetsVisibles.size > 0) {
        return;
      }


      video.pause();

      video.removeAttribute("src");

      video.load();

      video.style.display = "none";

      btnSonido.style.display = "none";

      citaActual = null;

    }


    /* =========================================
       ACTIVAR SONIDO
       ========================================= */

    btnSonido.addEventListener("click", async () => {

      video.muted = false;


      try {

        await video.play();

        btnSonido.style.display = "none";

      } catch (error) {

        console.error(error);

      }

    });


    /* =========================================
       TODOS LOS TARGETS
       ========================================= */

    const targets =
      document.querySelectorAll(
        "[mindar-image-target]"
      );


    targets.forEach(target => {


      /* ===============================
         IMAGEN ENCONTRADA
         =============================== */

      target.addEventListener(
        "targetFound",
        () => {

          const cita =
            target.getAttribute("data-cita");


          targetsVisibles.add(cita);


          reproducirCita(cita);

        }
      );


      /* ===============================
         IMAGEN PERDIDA
         =============================== */

      target.addEventListener(
        "targetLost",
        () => {

          const cita =
            target.getAttribute("data-cita");


          targetsVisibles.delete(cita);


          /*
           * Esperamos un instante por si
           * inmediatamente aparece otra cita.
           */

          setTimeout(() => {

            ocultarVideo();

          }, 150);

        }
      );

    });


  </script>
